<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore selected websites designed and built by Matthew Anderson."
    />
    <meta name="theme-color" content="#f3efe6" />
    <title>Selected Websites — BuiltByMatthew</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link rel="stylesheet" href="../styles.css?v=7" />
    <link rel="stylesheet" href="../components/mobile-navigation.css?v=1" />
    <script src="../vendor/gsap/gsap.min.js" defer></script>
    <script src="../vendor/gsap/ScrollTrigger.min.js" defer></script>
    <script src="../portfolio-projects.js" defer></script>
    <script src="../portfolio-gallery.js?v=3" defer></script>
    <script type="module" src="../components/mobile-navigation.js?v=1"></script>
  </head>
  <body class="websites-page">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <div class="page-shell">
      <header class="site-header" aria-label="Primary navigation">
        <a class="wordmark" href="../" aria-label="builtbymatthew, home">
          <img class="wordmark-logo" src="../favicon.png" alt="" aria-hidden="true" />
          <span>builtbymatthew</span>
        </a>

        <nav class="nav-links" aria-label="Main menu">
          <a href="#work" aria-current="page">Work</a>
          <a href="../#about">About</a>
          <a href="../#contact">Contact</a>
        </nav>
        <builtbymatthew-mobile-nav></builtbymatthew-mobile-nav>
      </header>

      <main class="site-main" id="main-content">
        <section class="portfolio-section" id="work" aria-labelledby="portfolio-title">
          <div class="portfolio-stage">
            <div class="portfolio-heading-group">
              <div>
                <p class="portfolio-kicker">Selected work</p>
                <h1 class="portfolio-title" id="portfolio-title">Don't take my word for it.</h1>
                <p class="portfolio-intro">Take a look at some of the websites I built.</p>
              </div>

              <div class="portfolio-nav" aria-label="Portfolio gallery controls">
                <div class="portfolio-progress" aria-hidden="true">
                  <span class="portfolio-progress-line is-active"></span>
                  <span class="portfolio-progress-line"></span>
                  <span class="portfolio-progress-line"></span>
                  <span class="portfolio-progress-line"></span>
                </div>
                <span class="portfolio-count">01 / 04</span>
                <div class="portfolio-arrows">
                  <button
                    class="portfolio-arrow portfolio-arrow--previous"
                    type="button"
                    aria-label="Previous project"
                    disabled
                  >
                    <span aria-hidden="true">←</span>
                  </button>
                  <button
                    class="portfolio-arrow portfolio-arrow--next"
                    type="button"
                    aria-label="Next project"
                  >
                    <span aria-hidden="true">→</span>
                  </button>
                </div>
              </div>
            </div>

            <div class="portfolio-viewport" tabindex="0" aria-label="Featured website projects">
              <div class="portfolio-track"></div>
            </div>
          </div>

          <noscript>
            <ul class="portfolio-fallback-list">
              <li><a href="https://doxatreasury.com">Doxa Treasury</a></li>
              <li>
                <a href="https://andomatthew1234.github.io/Chromecraft">
                  Chromecraft Browser Website
                </a>
              </li>
              <li><a href="https://sydneybushdances.com">Sydney Bush Dances</a></li>
              <li><a href="https://kingroyaltyeggs.com">King Royalty Eggs</a></li>
            </ul>
          </noscript>
        </section>
      </main>
    </div>
  </body>
</html>
