<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Decode a BuiltByMatthew configuration code and view its original indicative estimate." />
    <meta name="theme-color" content="#f3efe6" />
    <title>Quote Viewer — BuiltByMatthew</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link rel="stylesheet" href="../styles.css?v=3" />
    <link rel="stylesheet" href="../components/mobile-navigation.css?v=1" />
    <link rel="stylesheet" href="../build-your-site/configurator.css?v=8" />
    <link rel="stylesheet" href="./quote-viewer.css?v=2" />
    <link rel="stylesheet" href="../components/site-footer.css?v=2" data-site-footer-styles />
    <script type="module" src="./quote-viewer.js?v=4"></script>
    <script type="module" src="../components/mobile-navigation.js?v=1"></script>
    <script type="module" src="../components/site-footer.js?v=1"></script>
  </head>
  <body>
    <a class="skip-link" href="#viewer">Skip to quote viewer</a>
    <div class="builder-shell viewer-shell">
      <header class="builder-header">
        <a class="wordmark" href="../" aria-label="builtbymatthew, home"><img class="wordmark-logo" src="../favicon.png" alt="" /><span>builtbymatthew</span></a>
        <a class="builder-close" href="../build-your-site/"><span>Build your site</span><span aria-hidden="true">↗</span></a>
        <builtbymatthew-mobile-nav></builtbymatthew-mobile-nav>
      </header>
      <main class="viewer-main" id="viewer">
        <header class="viewer-intro">
          <p class="eyebrow">Public quote utility</p>
          <h1>Recover an estimate.</h1>
          <p>Paste a BuiltByMatthew configuration code to see the exact original quote snapshot. This page is public and the code should never contain personal or sensitive information.</p>
        </header>
        <section class="viewer-input" aria-labelledby="viewer-input-title">
          <h2 id="viewer-input-title">Configuration code</h2>
          <label class="sr-only" for="viewer-code">Configuration code</label>
          <textarea id="viewer-code" data-viewer-code spellcheck="false" autocomplete="off" placeholder="BBM1-..."></textarea>
          <button class="generate-button" type="button" data-decode>Decode quote</button>
          <p class="recovery-status" data-viewer-status aria-live="polite"></p>
        </section>
        <div id="viewer-result"></div>
      </main>
    </div>
    <builtbymatthew-footer></builtbymatthew-footer>
  </body>
</html>
